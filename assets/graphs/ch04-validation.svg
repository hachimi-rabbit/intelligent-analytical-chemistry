   <g id="text_1">
    <text style="font-weight: 700; font-size: 23px; font-family: 'Microsoft YaHei'; text-anchor: start; fill: #172b45" x="54.2304" y="50.013297" transform="rotate(-0 54.2304 50.013297)">独立标本与跨仪器验证</text>
   </g>
   <g id="text_2">
    <text style="font-size: 13px; font-family: 'Microsoft YaHei'; text-anchor: start; fill: #172b45" x="54.2304" y="80.879703" transform="rotate(-0 54.2304 80.879703)">90 个物理标本  ×  2 台仪器  ×  3 次扫描  =  540 条谱</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 15px; font-family: 'Microsoft YaHei'; text-anchor: start; fill: #a84040" x="54.2304" y="136.527937" transform="rotate(-0 54.2304 136.527937)">反例  按光谱行随机分折</text>
   </g>
   <g id="text_4">
    <text style="font-size: 13px; font-family: 'Microsoft YaHei'; fill: #172b45" transform="translate(131.053406 187.012108)">同一标本 S01</text>
    <text style="font-size: 13px; font-family: 'Microsoft YaHei'; fill: #172b45" transform="translate(124.493484 208.455126)">重复谱 1、2、3</text>
   </g>
   <g id="text_5">
    <text style="font-size: 13px; font-family: 'Microsoft YaHei'; text-anchor: middle; fill: #172b45" x="509.04" y="197.740219" transform="rotate(-0 509.04 197.740219)">训练折  谱 1、2</text>
   </g>
   <g id="text_6">
    <text style="font-size: 13px; font-family: 'Microsoft YaHei'; text-anchor: middle; fill: #172b45" x="847.728" y="197.707719" transform="rotate(-0 847.728 197.707719)">验证折  谱 3</text>
   </g>
   <g id="text_7">
    <text style="font-size: 13px; font-family: 'Microsoft YaHei'; text-anchor: middle; fill: #a84040" x="509.04" y="266.531703" transform="rotate(-0 509.04 266.531703)">标本身份跨越验证边界  →  高分可能来自记忆</text>
   </g>
   <g id="text_8">
    <text style="font-weight: 700; font-size: 15px; font-family: 'Microsoft YaHei'; text-anchor: start; fill: #207365" x="54.2304" y="315.305109" transform="rotate(-0 54.2304 315.305109)">正确路径  先按标本留出 再按仪器评价</text>
   </g>
   <g id="text_9">
    <text style="font-size: 13px; font-family: 'Microsoft YaHei'; fill: #172b45" transform="translate(138.973138 365.756624)">开发  72 个标本</text>
    <text style="font-size: 13px; font-family: 'Microsoft YaHei'; fill: #172b45" transform="translate(128.664544 387.180345)">只用 A 的 216 条谱</text>
   </g>
   <g id="text_10">
    <text style="font-size: 13px; font-family: 'Microsoft YaHei'; fill: #172b45" transform="translate(464.214338 365.762718)">A 开发内分组 CV</text>
    <text style="font-size: 13px; font-family: 'Microsoft YaHei'; fill: #172b45" transform="translate(448.8784 387.231126)">按标本分组并选择模型</text>
   </g>
   <g id="text_11">
    <text style="font-size: 13px; font-family: 'Microsoft YaHei'; fill: #172b45" transform="translate(786.0512 365.71803)">全部开发数据重训</text>
    <text style="font-size: 13px; font-family: 'Microsoft YaHei'; fill: #172b45" transform="translate(812.0512 387.275813)">冻结模型</text>
   </g>
   <g id="text_12">
    <text style="font-size: 13px; font-family: 'Microsoft YaHei'; fill: #172b45" transform="translate(132.473138 506.758296)">留出  18 个新标本</text>
    <text style="font-size: 13px; font-family: 'Microsoft YaHei'; fill: #172b45" transform="translate(133.631966 528.169829)">开发标本交集为 0</text>
   </g>
   <g id="text_13">
    <text style="font-size: 12px; font-family: 'Microsoft YaHei'; fill: #172b45" transform="translate(571.67115 507.203379)">同一冻结模型  对同一批新标本作配对测试</text>
    <text style="font-size: 12px; font-family: 'Microsoft YaHei'; fill: #172b45" transform="translate(537.181463 526.811309)">A 仪器 54 条谱（同仪器）   B 仪器 54 条谱（跨仪器）</text>
   </g>
   <g id="text_14">
    <text style="font-size: 12px; font-family: 'Microsoft YaHei'; text-anchor: middle; fill: #2b5b94" x="518.7168" y="589.332375" transform="rotate(-0 518.7168 589.332375)">A 与 B 是同一批 18 个标本的配对测试  不是 36 个独立样本</text>
   </g>
   <g id="text_15">
    <text style="font-size: 12px; font-family: 'Microsoft YaHei'; text-anchor: start; fill: #172b45" x="54.2304" y="651.192937" transform="rotate(-0 54.2304 651.192937)">拟合边界  标准化与 PCA 只在训练折 fit；外部测试不参与选择</text>
   </g>
   <g id="text_16">
    <text style="font-size: 12px; font-family: 'Microsoft YaHei'; text-anchor: start; fill: #172b45" x="54.2304" y="685.567312" transform="rotate(-0 54.2304 685.567312)">读图要点  重复谱泄漏和仪器域变化需要分别检验。</text>
   </g>
  </g>
